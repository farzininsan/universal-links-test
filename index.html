<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LivWell</title>

<meta name="theme-color" content="#499F00">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #499F00 0%, #2e6700 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 90%;
    max-width: 420px;
    text-align: center;
}

.logo {
    width: 100px;
    height: 100px;
    background: white;
    border-radius: 24px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 16px;
    line-height: 1.5;
    opacity: .9;
    margin-bottom: 32px;
}

.card {
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
}

.button {
    display: block;
    width: 100%;
    text-decoration: none;
    background: white;
    color: #499F00;
    padding: 16px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 16px;
    transition: .2s;
}

.button:hover {
    transform: translateY(-2px);
}

.small-text {
    margin-top: 18px;
    font-size: 13px;
    opacity: .8;
}

.loader {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,.25);
    border-top: 3px solid white;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}
</style>

<script>
setTimeout(function () {
    window.location.href =
    "https://apps.apple.com/in/app/id1509195628";
}, 3000);
</script>

</head>

<body>

<div class="container">

    <div class="logo">
        ❤️
    </div>

    <h1>LivWell</h1>

    <p class="subtitle">
        Your journey towards a healthier and happier life starts here.
    </p>

    <div class="card">

        <div class="loader"></div>

        <h3>Opening LivWell...</h3>

        <p style="margin-top:12px; opacity:.85;">
            If the app is not installed, you'll be redirected to the App Store automatically.
        </p>

    </div>

    <a class="button"
       href="https://apps.apple.com/in/app/id1509195628">
       Download LivWell
    </a>

    <div class="small-text">
        Redirecting to App Store in a few seconds...
    </div>

</div>

</body>
</html>

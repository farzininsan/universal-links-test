<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LivWell — Live Better Every Day</title>
  <meta name="description" content="Your personal wellness companion. Track habits, build routines, and live your best life." />

  <!-- Apple Universal Links meta (optional, reinforces smart banner) -->
  <meta name="apple-itunes-app" content="app-id=1509195628" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #FAF8F3;
      --warm-white: #FFFEF9;
      --ink: #1A1714;
      --ink-muted: #6B6560;
      --ink-faint: #B5AFA8;
      --sage: #4A7C5F;
      --sage-light: #D4E8DB;
      --sage-dark: #2E5240;
      --terracotta: #C4643A;
      --terracotta-light: #F2D9CC;
      --gold: #C9A84C;
      --gold-light: #F5EDD1;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── layout ── */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* ── decorative ring ── */
    .ring {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .ring-1 {
      width: 500px; height: 500px;
      top: -160px; right: -180px;
      background: radial-gradient(circle, rgba(74,124,95,0.08) 0%, transparent 70%);
    }
    .ring-2 {
      width: 400px; height: 400px;
      bottom: -120px; left: -150px;
      background: radial-gradient(circle, rgba(196,100,58,0.07) 0%, transparent 70%);
    }

    /* ── logo / wordmark ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 56px;
    }
    .logo-mark {
      width: 36px; height: 36px;
      background: var(--sage);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { display: block; }
    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    /* ── hero text ── */
    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 16px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 10vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      color: var(--ink);
      margin-bottom: 20px;
    }
    h1 em {
      font-style: italic;
      color: var(--sage);
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.65;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 48px;
      max-width: 380px;
    }

    /* ── status badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--warm-white);
      border: 1px solid rgba(74,124,95,0.2);
      border-radius: 100px;
      padding: 6px 14px 6px 10px;
      font-size: 13px;
      color: var(--ink-muted);
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeSlideUp 0.6s 0.3s ease forwards;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--sage);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.8); }
    }

    /* ── CTA button ── */
    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      opacity: 0;
      animation: fadeSlideUp 0.6s 0.5s ease forwards;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 28px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:hover { background: var(--sage-dark); transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-primary svg { flex-shrink: 0; }

    .btn-store {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 28px;
      background: transparent;
      color: var(--ink-muted);
      border: 1px solid rgba(26,23,20,0.15);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-store:hover { border-color: rgba(26,23,20,0.3); color: var(--ink); }

    /* ── features strip ── */
    .features {
      display: flex;
      gap: 20px;
      margin-top: 64px;
      opacity: 0;
      animation: fadeSlideUp 0.6s 0.7s ease forwards;
    }
    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      flex: 1;
    }
    .feature-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .feature-icon.sage { background: var(--sage-light); }
    .feature-icon.terra { background: var(--terracotta-light); }
    .feature-icon.gold { background: var(--gold-light); }

    .feature-label {
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.4;
    }

    /* ── divider ── */
    .divider {
      width: 1px;
      height: 24px;
      background: rgba(26,23,20,0.1);
      align-self: center;
    }

    /* ── footer ── */
    .footer {
      margin-top: 56px;
      padding-bottom: 32px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
      opacity: 0;
      animation: fadeSlideUp 0.6s 0.9s ease forwards;
    }

    /* ── animations ── */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-animate {
      opacity: 0;
      animation: fadeSlideUp 0.7s 0.1s ease forwards;
    }
  </style>
</head>
<body>

  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>

  <div class="wrapper">

    <!-- Logo -->
    <div class="logo hero-animate">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 3C10 3 6 6.5 6 10.5C6 12.985 7.79 15 10 15C12.21 15 14 12.985 14 10.5C14 6.5 10 3 10 3Z" fill="white" fill-opacity="0.9"/>
          <path d="M10 8V17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M8 12L10 10L12 12" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">LivWell</span>
    </div>

    <!-- Status -->
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="status-text">Checking your device…</span>
    </div>

    <!-- Hero -->
    <p class="eyebrow hero-animate">Your Wellness Journey</p>
    <h1 class="hero-animate">Live <em>better</em>,<br/>every single day.</h1>
    <p class="subtitle hero-animate">
      Build habits that stick, track your well-being, and unlock a healthier version of yourself — one day at a time.
    </p>

    <!-- CTA -->
    <div class="cta-wrap" id="cta-wrap">
      <!-- Filled dynamically by JS -->
    </div>

    <!-- Features -->
    <div class="features">
      <div class="feature">
        <div class="feature-icon sage">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M4 10.5C4 7 7 4 10 4s6 3 6 6.5" stroke="#2E5240" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="13" r="2.5" fill="#2E5240" fill-opacity="0.7"/>
          </svg>
        </div>
        <span class="feature-label">Daily<br/>Habits</span>
      </div>
      <div class="divider"></div>
      <div class="feature">
        <div class="feature-icon terra">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="4" y="12" width="2" height="4" rx="1" fill="#C4643A"/>
            <rect x="8" y="8" width="2" height="8" rx="1" fill="#C4643A"/>
            <rect x="12" y="5" width="2" height="11" rx="1" fill="#C4643A"/>
            <rect x="16" y="3" width="2" height="13" rx="1" fill="#C4643A" fill-opacity="0.5"/>
          </svg>
        </div>
        <span class="feature-label">Progress<br/>Insights</span>
      </div>
      <div class="divider"></div>
      <div class="feature">
        <div class="feature-icon gold">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 3L11.8 7.7L17 8.3L13.3 11.8L14.4 17L10 14.4L5.6 17L6.7 11.8L3 8.3L8.2 7.7L10 3Z" fill="#C9A84C" fill-opacity="0.8" stroke="#C9A84C" stroke-width="0.5"/>
          </svg>
        </div>
        <span class="feature-label">Daily<br/>Goals</span>
      </div>
    </div>

    <p class="footer">© 2024 LivWell · <a href="https://apps.apple.com/in/app/id1509195628" style="color:inherit;">App Store</a></p>

  </div>

  <script>
    const APP_STORE_URL = 'https://apps.apple.com/in/app/id1509195628';
    // Deep link scheme — adjust if your app has a custom URL scheme
    const DEEP_LINK = 'livwell://open';

    const statusEl = document.getElementById('status-text');
    const ctaWrap  = document.getElementById('cta-wrap');

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function renderOpenApp() {
      statusEl.textContent = '✓ App detected on this device';
      ctaWrap.innerHTML = `
        <a href="${DEEP_LINK}" class="btn-primary" id="open-btn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 3C10 3 6 6.5 6 10.5C6 12.985 7.79 15 10 15C12.21 15 14 12.985 14 10.5C14 6.5 10 3 10 3Z" fill="currentColor" fill-opacity="0.85"/>
          </svg>
          Open LivWell App
        </a>
        <a href="${APP_STORE_URL}" class="btn-store">
          View on App Store
        </a>
      `;
    }

    function renderGetApp() {
      statusEl.textContent = 'Available on the App Store';
      ctaWrap.innerHTML = `
        <a href="${APP_STORE_URL}" class="btn-primary">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.5 10.5C14.49 8.88 15.3 7.64 16.94 6.73C16.03 5.44 14.67 4.73 12.88 4.6C11.19 4.47 9.33 5.59 8.67 5.59C7.97 5.59 6.31 4.64 5.02 4.64C2.35 4.68 0.5 6.75 0.5 10.16C0.5 11.26 0.7 12.4 1.1 13.57C1.64 15.14 3.59 19.12 5.62 19.05C6.84 19.02 7.7 18.19 9.27 18.19C10.79 18.19 11.59 19.05 12.96 19.05C15.01 19.02 16.78 15.39 17.3 13.81C14.67 12.56 14.5 10.55 14.5 10.5ZM11.82 3.1C13.17 1.51 13.03 0.06 12.98 0.5C11.08 0.15 9.3 1.07 8.3 2.44C7.39 3.7 7.41 5.04 7.45 5.5C9.5 5.5 10.55 4.6 11.82 3.1Z" fill="currentColor"/>
          </svg>
          Download on App Store
        </a>
        <span style="font-size:13px; color:var(--ink-faint); text-align:center;">Free to download · iPhone &amp; iPad</span>
      `;
    }

    function renderNonIOS() {
      statusEl.textContent = 'Available on iPhone &amp; iPad';
      ctaWrap.innerHTML = `
        <a href="${APP_STORE_URL}" class="btn-primary">
          Get LivWell on iOS
        </a>
        <span style="font-size:13px; color:var(--ink-faint); text-align:center;">Scan or open on your iPhone</span>
      `;
    }

    // Universal link triggers the app if installed.
    // For the landing page we try to detect if iOS, then show appropriate CTA.
    // True install detection isn't possible via JS — Universal Links handle it natively.
    if (isIOS()) {
      // On iOS: Universal Links handle it automatically when tapped from a link.
      // From direct browser navigation we show "Open app" which tries the deep link,
      // and falls back to App Store after 1.5s if app isn't installed.
      renderOpenApp();

      document.addEventListener('click', function(e) {
        const btn = e.target.closest('#open-btn');
        if (!btn) return;
        e.preventDefault();
        window.location = DEEP_LINK;
        setTimeout(() => { window.location = APP_STORE_URL; }, 1500);
      });
    } else {
      renderNonIOS();
    }
  </script>

</body>
</html>
